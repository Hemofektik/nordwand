<!DOCTYPE HTML>
<html>
	<head>
		<title>Nordwand</title>
        
        <script src="pnglib.js"></script>

		<script src="PixelSprite.js"></script>
        <script src="Physics.js"></script>
		<script src="MusicPlayer.js"></script>
        <script src="Camera.js"></script>
        <script src="Wall.js"></script>
        <script src="Rope.js"></script>
        <script src="Skeleton.js"></script>
        <script src="ClimbingAI.js"></script>
        <script src="Player.js"></script>
		<script src="Game.js"></script>

		<script>
			// Engine globals
			var fps = 60;
			var mspf = 1000 / fps;
			var updateInterval;
			var center;
			var viewport_radius;
			
			// Game globals
			var game;

			// Begin of "Disable right click script"
			/////////////////////////////////// 
			document.oncontextmenu = new Function("return false");
			// End of "Disable right click script"

			// Setup function called when page loads
			function main()
			{
				var canvas = document.getElementById('canvas');
				if (canvas.getContext) {
					// Canvas Setup
				    canvas.width = 560;
				    canvas.height = 840;
					center = [canvas.width/2, canvas.height/2];
					
					// Initialize the game
					game = new Game(canvas);
					game.load_level();
					
					// Create requestAnimFrame if it doesn't exist
					window.requestAnimFrame = (function(){
						return  window.requestAnimationFrame   || 
							window.webkitRequestAnimationFrame || 
							window.mozRequestAnimationFrame    || 
							window.oRequestAnimationFrame      || 
							window.msRequestAnimationFrame     || 
							function(/* function */ callback, /* DOMElement */ element){
								window.setTimeout(callback, mspf);
							};
					})();
					
					// Animate!
					(function animloop(){
						game.update();
						requestAnimFrame(animloop);
					})();
					// updateInterval = window.setInterval("game.update()", mspf);
				}
			}
		</script>
		<link rel="stylesheet" type="text/css" href="style.css">
		<link id="favicon" rel="icon" type="image/png" href="icon_16.png" />
		<meta name="viewport" content="width=450 , initial-scale=1, maximum-scale=1">
	</head>
	<body onload="main();">
        <div id=bgDiv >
            <div id="gameDiv">
		        <canvas id="canvas">Sorry, no canvas for you!</canvas>
		        <ul id="controls">
                    <li id="help">
                        <label>
                            Help [H]</label></li>
                    <li id="pause">
                        <label>
                            Pause [P]</label></li>
                    <li id="newlevel">
                        <label>
                            New random level [R]</label></li>
                    <li id="mute">
                        <label>
                            Mute sounds [M]</label></li>
                </ul>
                <div id="debugInfobBox">
                    <pre id="debuginfo">
                    </pre>
                </div>
                <div id="songinfo" class="idle">
                    <div id="songtitle">
                    </div>
                    <div id="songartist">
                    </div>
                </div>
                <div id="pausedmessage" class="messages">
                    <p id="mainmessage">
                        Paused</p>
                    <p id="subtext">
                        Click here to resume playing.</p>
                </div>
                <div id="deathmessage" class="messages">
                    <p id="mainmessage">
                        You were consumed!</p>
                    <p id="subtext">
                        Click here to restart the level.</p>
                </div>
                <div id="warningmessage" class="messages">
                    <p id="mainmessage">
                        Uhhhhh.</p>
                    <p id="subtext">
                        You may just wanna click here to restart the level.</p>
                </div>
                <div id="successmessage" class="messages">
                    <p id="mainmessage">
                        Good!</p>
                    <p id="subtext">
                        Click here to start another random level.</p>
                </div>
            </div>
        </div >
	</body>
</html>
